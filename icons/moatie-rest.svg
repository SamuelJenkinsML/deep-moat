<style>text{fill:#c0caf5;white-space:pre}.p{fill:#f7768e}.w{fill:#7aa2f7;animation:flow 4s steps(16) 3}.w:nth-of-type(even){animation-direction:reverse}
.bob{animation:bob 4s ease-in-out 3}.film{animation:film 12s step-end 1}.z{font-size:20px;opacity:0;animation:z 4s ease-out 3}
@keyframes flow{to{transform:translateX(-128px)}}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes film{0.00%{transform:translateY(-0px)}}
@keyframes z{30%{opacity:.8}to{opacity:0;transform:translate(12px,-40px)}}
@media (prefers-color-scheme:light){text{fill:#3760bf}.p{fill:#f52a65}.w{fill:#2e7de9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
