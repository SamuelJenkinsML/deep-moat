<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Deep Moat</title>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="core.js">
<link rel="icon" href="icons/32.png">
<main class="blocked">
  <img class="moatie" src="icons/moatie.svg" alt="">
  <img class="moatie shut" src="icons/moatie-rest.svg" alt="">
  <h1 id="host"></h1>
  <p id="why" class="dim"></p>
  <p id="focus" hidden></p>
  <details id="glass">
    <summary>Break glass</summary>
    <p class="dim">Type this exactly — no pasting.</p>
    <code id="challenge"></code>
    <p><input id="typed" autocomplete="off" spellcheck="false" aria-label="Challenge"></p>
    <p id="wait" class="dim"></p>
  </details>
</main>
<script type="module" src="blocked.js"></script>
