<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Deep Moat</title>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="core.js">
<link rel="icon" href="icons/32.png">
<main class="blocked">
  <svg class="moatie" viewBox="0 0 128 128" aria-hidden="true">
    <g class="tower"><rect x="32" y="24" width="18" height="28" rx="6"/><rect x="55" y="24" width="18" height="28" rx="6"/><rect x="78" y="24" width="18" height="28" rx="6"/><rect x="32" y="40" width="64" height="64" rx="10"/></g>
    <g class="face" stroke-width="4" stroke-linecap="round">
      <g class="open"><circle cx="52" cy="66" r="6"/><circle cx="76" cy="66" r="6"/></g>
      <path class="shut" d="M46 66q6 5 12 0M70 66q6 5 12 0" fill="none"/>
      <path d="M57 78q7 7 14 0" fill="none"/>
    </g>
    <path class="wave" d="M14 104q10-8 20 0t20 0t20 0t20 0t20 0" fill="none" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <h1 id="host"></h1>
  <p id="why" class="dim"></p>
  <p id="focus" hidden></p>
  <details id="glass">
    <summary>Break glass</summary>
    <p class="dim">Type this exactly — no pasting.</p>
    <code id="challenge"></code>
    <p><input id="typed" autocomplete="off" spellcheck="false" aria-label="Challenge"></p>
    <p id="wait" class="dim"></p>
  </details>
</main>
<script type="module" src="blocked.js"></script>
